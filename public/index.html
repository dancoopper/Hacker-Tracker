<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hacker Tracker — Scanner</title>
  <meta name="description" content="QR code check-in scanner for hackathon attendees." />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ── Header ──────────────────────────────────────────── -->
  <header class="site-header">
    <a href="/" class="logo"><span>Hacker</span>Tracker</a>
    <nav class="nav-links">
      <a href="/" class="active" id="nav-scanner">Scanner</a>
      <a href="/admin.html" id="nav-admin">Admin</a>
    </nav>
  </header>

  <main class="page-container">
    <div class="page-hero">
      <h1>Check-In Scanner</h1>
      <p>Point a hacker's QR code at the camera to check them in.</p>
    </div>

    <!-- Status Banner -->
    <div class="status-banner" id="status-banner" role="alert">
      <div class="status-icon" id="status-icon"></div>
      <div>
        <div class="status-title" id="status-title"></div>
        <div class="status-sub" id="status-sub"></div>
      </div>
    </div>

    <!-- Main layout: scanner + feed side by side on wide screens -->
    <div class="scanner-layout">

      <!-- Scanner card -->
      <div class="card scanner-card">
        <div class="section-header">
          <h2>Camera</h2>
          <span id="scan-status-pill" class="badge badge-muted">● Idle</span>
        </div>

        <div class="scanner-wrap" id="scanner-wrap">
          <video id="video" playsinline autoplay muted></video>
          <div class="scanner-overlay">
            <div class="scan-reticle"></div>
            <div class="scan-line" id="scan-line"></div>
          </div>
        </div>

        <canvas id="canvas" style="display:none;"></canvas>

        <div class="scanner-controls">
          <button class="btn btn-primary btn-full-mobile" id="btn-start">▶ Start Camera</button>
          <button class="btn btn-ghost" id="btn-stop" disabled>■ Stop</button>
        </div>

        <!-- Camera error tip -->
        <div class="camera-tip" id="camera-tip" style="display:none;"></div>

        <!-- Manual entry fallback -->
        <details class="manual-details">
          <summary class="manual-summary">
            ⌨️ Manual ID / URL entry (fallback)
          </summary>
          <div class="manual-input-wrap">
            <input type="text" id="manual-uuid" placeholder="Paste ID or full MLH URL…" autocomplete="off" spellcheck="false" />
            <button class="btn btn-primary" id="btn-manual-checkin">Check In</button>
          </div>
        </details>
      </div>

      <!-- Recent check-ins feed -->
      <div class="card feed-card">
        <div class="section-header">
          <h2>Recent Check-Ins</h2>
          <span id="checkin-count" class="badge badge-green">0</span>
        </div>

        <ul class="feed-list" id="feed-list">
          <li class="empty-state">
            <div class="empty-icon">📭</div>
            <p>No check-ins yet</p>
          </li>
        </ul>
      </div>

    </div><!-- /scanner-layout -->
  </main>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- ── Meal Picker Modal ──────────────────────────────── -->
  <div class="modal-backdrop" id="meal-modal" role="dialog" aria-modal="true" aria-labelledby="meal-modal-title">
    <div class="modal meal-modal">
      <div class="modal-header">
        <div>
          <div class="meal-modal-name" id="meal-modal-name"></div>
          <h2 id="meal-modal-title">Select a Meal</h2>
        </div>
        <button class="modal-close" id="meal-modal-close" aria-label="Close">✕</button>
      </div>
      <p class="meal-modal-hint">Which meal is this hacker checking in for?</p>
      <!-- Buttons are injected here by app.js from /api/meal-types -->
      <div class="meal-btn-grid" id="meal-btn-grid"></div>
      <!-- Registration link — shown only when a full URL was scanned -->
      <a id="meal-modal-reg-link"
         class="btn btn-ghost meal-reg-link"
         href="#"
         target="_blank"
         rel="noopener noreferrer"
         style="display:none;">
        🔗 View Registration
      </a>
    </div>
  </div>

  <!-- jsQR from CDN (no build step needed) -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
